name: Private visual validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-visual-test
  cancel-in-progress: false

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    steps:
      - name: Verify private repository token
        working-directory: ${{ github.workspace }}
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: |
          if [[ -z "$CONTENT_TOKEN" ]]; then
            echo "::error::Set the CONTENT_TOKEN secret with Contents read/write access only to the private repository."
            exit 1
          fi

      - name: Checkout private project and pinned public core
        uses: actions/checkout@v4
        with:
          repository: edward9s/godot-dungeon-content
          token: ${{ secrets.CONTENT_TOKEN }}
          path: source
          submodules: true
          persist-credentials: false

      - name: Confirm pinned core is available
        run: |
          set -euo pipefail
          test -s core/scripts/dungeon_generator.gd
          test -s core/scripts/navigation.gd
          git -C core rev-parse --verify HEAD
          git rev-parse --verify HEAD

      - name: Prepare embedded core for Godot import
        run: bash tools/prepare_core.sh

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot/releases/download/$version-stable"
          curl -fLsS --retry 3 "$base/Godot_v$version-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v$version-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"

      - name: Import private project
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot" --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Render evidence with actual Mobile renderer
        env:
          GODOT: ${{ runner.temp }}/godot
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
          test -n "$VK_ICD_FILENAMES"
          timeout 900s xvfb-run -a bash tools/render.sh 2>&1 | tee "$RUNNER_TEMP/render.log"
          test "$(grep -c 'CAPTURE PASSED' "$RUNNER_TEMP/render.log")" -eq 8
          if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/render.log"; then exit 1; fi

      - name: Publish visual evidence to private release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: |
          set -euo pipefail
          repo=edward9s/godot-dungeon-content
          tag=visual-check
          source_sha="$(git rev-parse HEAD)"
          shopt -s nullglob
          captures=(docs/captures/*.png docs/captures/*.json)
          test "${#captures[@]}" -eq 16
          notes="Linux Mobile-renderer visual validation for private source commit $source_sha.
          Godot 4.7.2, llvmpipe; this is not Android device performance.
          Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${captures[@]}" --clobber --repo "$repo"
            gh api -X PATCH "repos/$repo/git/refs/tags/$tag" -f sha="$source_sha" -F force=true >/dev/null
            gh release edit "$tag" --repo "$repo" --title "Visual validation (latest #$GITHUB_RUN_NUMBER)" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" "${captures[@]}" --repo "$repo" --target "$source_sha" --title "Visual validation (latest #$GITHUB_RUN_NUMBER)" --notes "$notes" --prerelease --latest=false
          fi
