name: Android core build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-android-core-release
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euo pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot/releases/download/$version-stable"
          curl -fLsS --retry 3 "$base/Godot_v$version-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v$version-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          curl -fLsS --retry 3 "$base/Godot_v$version-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/$version.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/$version.stable/"

      - name: Import and run checks
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot" --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/import.log"; then exit 1; fi
          "$RUNNER_TEMP/godot" --headless --path . --script tests/test_core.gd 2>&1 | tee "$RUNNER_TEMP/core.log"
          grep -F "Core validation passed:" "$RUNNER_TEMP/core.log"
          timeout 30s "$RUNNER_TEMP/godot" --headless --path . --quit-after 8 2>&1 | tee "$RUNNER_TEMP/scene.log"
          if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/core.log" "$RUNNER_TEMP/scene.log"; then exit 1; fi

      - name: Verify default Godot icon configuration
        shell: bash
        run: |
          set -euo pipefail
          test ! -e icon.svg
          if grep -Eq '^config/icon=' project.godot; then
            echo "::error::A project icon must not be configured."
            exit 1
          fi
          if grep -Eq '^launcher_icons/' export_presets.cfg; then
            echo "::error::An Android launcher icon must not be configured."
            exit 1
          fi

      - name: Configure Android exporter
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Restore release signer
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/source.jks"
          keytool -list -keystore "$RUNNER_TEMP/source.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/source.jks" -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/release.p12" -deststoretype PKCS12 \
            -deststorepass "$KEY_PASSWORD" -destkeypass "$KEY_PASSWORD" -destalias "$KEY_ALIAS"

      - name: Export signed core release APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          "$RUNNER_TEMP/godot" --headless --path . --export-release Android build/GodotCore-release-arm64.apk 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/export.log"; then exit 1; fi
          test -s build/GodotCore-release-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/GodotCore-release-arm64.apk
          unzip -l build/GodotCore-release-arm64.apk | grep -F 'assets/' >/dev/null
          analyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -1)"
          test -x "$analyzer"
          package_id="$("$analyzer" manifest application-id build/GodotCore-release-arm64.apk)"
          test "$package_id" = "com.edward9s.godotandroidcore"
          test "$("$analyzer" manifest debuggable build/GodotCore-release-arm64.apk)" = "false"
          echo "Verified release package: $package_id"
          python3 - <<'PYAPK'
          import zipfile
          apk = zipfile.ZipFile('build/GodotCore-release-arm64.apk')
          abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
          assert abis == {'arm64-v8a'}, abis
          PYAPK

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=test-build
          apk=build/GodotCore-release-arm64.apk
          notes="Signed Godot Android Core arm64 release APK.
          Source commit: $GITHUB_SHA
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Godot Android Core (latest #$GITHUB_RUN_NUMBER)" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" \
              --title "Godot Android Core (latest #$GITHUB_RUN_NUMBER)" --notes "$notes" \
              --prerelease --latest=false --target "$GITHUB_SHA"
          fi

      - name: Remove signing key files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/source.jks" "$RUNNER_TEMP/release.p12"
