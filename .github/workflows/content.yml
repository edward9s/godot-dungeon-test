name: Private Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-android-test
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    timeout-minutes: 75
    steps:
      - name: Verify private repository token
        working-directory: ${{ github.workspace }}
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: |
          if [[ -z "$CONTENT_TOKEN" ]]; then
            echo "::error::Set the CONTENT_TOKEN secret with Contents read/write access only to the private repository."
            exit 1
          fi

      - name: Checkout private project and pinned public core
        uses: actions/checkout@v4
        with:
          repository: edward9s/godot-dungeon-content
          token: ${{ secrets.CONTENT_TOKEN }}
          path: source
          submodules: true
          persist-credentials: false

      - name: Confirm pinned core is available
        run: |
          set -euo pipefail
          test -s core/scripts/dungeon_generator.gd
          test -s core/scripts/navigation.gd
          git -C core rev-parse --verify HEAD
          git rev-parse --verify HEAD

      - name: Prepare embedded core for Godot import
        run: bash tools/prepare_core.sh

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdkmanager"
          analyzer="$(dirname "$sdkmanager")/apkanalyzer"
          test -x "$analyzer"
          echo "APK_ANALYZER=$analyzer" >> "$GITHUB_ENV"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot/releases/download/$version-stable"
          curl -fLsS --retry 3 "$base/Godot_v$version-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v$version-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          curl -fLsS --retry 3 "$base/Godot_v$version-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-templates" "$HOME/.local/share/godot/export_templates/$version.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/$version.stable/"
          test -s "$HOME/.local/share/godot/export_templates/$version.stable/android_release.apk"
          "$RUNNER_TEMP/godot" --version

      - name: Configure Android exporter and import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          "$RUNNER_TEMP/godot" --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Test deterministic layout and scene creation
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "$RUNNER_TEMP/godot" --headless --path . --script tests/test_dungeon.gd 2>&1 | tee "$RUNNER_TEMP/generator.log"
          grep -F "Dungeon generation passed:" "$RUNNER_TEMP/generator.log"
          timeout 90s "$RUNNER_TEMP/godot" --headless --path . --fixed-fps 60 --script tests/test_controls.gd 2>&1 | tee "$RUNNER_TEMP/controls.log"
          grep -F "Controls passed:" "$RUNNER_TEMP/controls.log"
          timeout 90s "$RUNNER_TEMP/godot" --headless --path . --fixed-fps 60 --script tests/test_combat.gd 2>&1 | tee "$RUNNER_TEMP/combat.log"
          grep -F "Combat passed:" "$RUNNER_TEMP/combat.log"
          timeout 90s "$RUNNER_TEMP/godot" --headless --path . --fixed-fps 60 --script tests/test_navigation.gd 2>&1 | tee "$RUNNER_TEMP/navigation.log"
          grep -F "Navigation passed:" "$RUNNER_TEMP/navigation.log"
          timeout 90s "$RUNNER_TEMP/godot" --headless --path . --fixed-fps 60 --script tests/test_orders.gd 2>&1 | tee "$RUNNER_TEMP/orders.log"
          grep -F "Orders passed:" "$RUNNER_TEMP/orders.log"
          timeout 90s "$RUNNER_TEMP/godot" --headless --path . --fixed-fps 60 --script tests/test_gestures.gd 2>&1 | tee "$RUNNER_TEMP/gestures.log"
          grep -F "Gestures passed:" "$RUNNER_TEMP/gestures.log"
          timeout 70s "$RUNNER_TEMP/godot" --headless --path . --quit-after 12 2>&1 | tee "$RUNNER_TEMP/scene.log"
          if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/generator.log" "$RUNNER_TEMP/controls.log" "$RUNNER_TEMP/combat.log" "$RUNNER_TEMP/navigation.log" "$RUNNER_TEMP/orders.log" "$RUNNER_TEMP/gestures.log" "$RUNNER_TEMP/scene.log"; then
            exit 1
          fi

      - name: Restore existing release signer
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/source.jks"
          keytool -list -keystore "$RUNNER_TEMP/source.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/source.jks" -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/release.p12" -deststoretype PKCS12 \
            -deststorepass "$KEY_PASSWORD" -destkeypass "$KEY_PASSWORD" -destalias "$KEY_ALIAS"

      - name: Export signed arm64 APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          "$RUNNER_TEMP/godot" --headless --path . --export-release Android build/GodotDungeon-test-arm64.apk 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/export.log"; then exit 1; fi
          test -s build/GodotDungeon-test-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/GodotDungeon-test-arm64.apk
          unzip -l build/GodotDungeon-test-arm64.apk | grep -F 'assets/' >/dev/null
          package_id="$("$APK_ANALYZER" manifest application-id build/GodotDungeon-test-arm64.apk)"
          test "$package_id" = "com.edward9s.godotdungeontest"
          test "$("$APK_ANALYZER" manifest debuggable build/GodotDungeon-test-arm64.apk)" = "false"
          echo "Verified release package: $package_id"
          python3 - <<'PYAPK'
          import zipfile
          apk = zipfile.ZipFile('build/GodotDungeon-test-arm64.apk')
          abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
          assert abis == {'arm64-v8a'}, abis
          PYAPK

      - name: Replace rolling test APK prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: |
          set -euo pipefail
          tag=test-build
          apk=build/GodotDungeon-test-arm64.apk
          source_sha="$(git rev-parse HEAD)"
          notes="Godot Dungeon Test (Godot 4.7.2 Mobile), commit $source_sha, run #$GITHUB_RUN_NUMBER.
          Existing repository release certificate. Arm64 APK only.
          Spirit Garden: orbitable isometric camera, swipe roll/blink, original characters, combat, seeded ruins, loot and Elder gate.
          Visual evidence is validated separately by the Private visual validation workflow.
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if gh release view "$tag" --repo "edward9s/godot-dungeon-content" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "edward9s/godot-dungeon-content"
            gh release edit "$tag" --repo "edward9s/godot-dungeon-content" \
              --title "Dungeon APK (latest #$GITHUB_RUN_NUMBER)" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" "$apk" --repo "edward9s/godot-dungeon-content" \
              --title "Dungeon APK (latest #$GITHUB_RUN_NUMBER)" --notes "$notes" \
              --prerelease --latest=false --target "$source_sha"
          fi

      - name: Remove private signing keys
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/source.jks" "$RUNNER_TEMP/release.p12"
